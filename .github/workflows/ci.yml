name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: this workflow only reads the code. A public repository takes
# pull requests from strangers, and the default token is broader than needed.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm has to exist before setup-node runs: `cache: pnpm` shells out to
      # pnpm to find the store path, and fails with "Unable to locate
      # executable file: pnpm" if it is not on PATH yet. The version comes from
      # the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
