version: 2

# main only ever receives what is going to production, so every automated bump
# lands on develop first.
#
# Note that `target-branch` steers VERSION updates only. Dependabot SECURITY
# updates always target the repository's default branch and there is no setting
# to change that, so `develop` must be the default branch on GitHub for this to
# hold. See docs/ramas-y-despliegue.md.
# The ecosystem is "npm" even though this project uses pnpm: Dependabot has no
# separate pnpm value, and the npm ecosystem covers npm, yarn and pnpm. Writing
# "pnpm" here makes Dependabot reject the whole file.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine bumps; anything major still arrives on its own,
      # because a major is a decision and deserves its own review.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
