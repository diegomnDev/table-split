name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: this workflow only reads the code. A public repository takes
# pull requests from strangers, and the default token is broader than needed.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
